<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 14px; color: #202124; padding: 24px; }
    h2 { font-size: 17px; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #5f6368; margin-bottom: 5px; text-transform: uppercase; }
    input, select { width: 100%; padding: 9px 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { border-color: #1a73e8; outline: none; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    hr { border: none; border-top: 1px solid #e8eaed; margin: 18px 0; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    button { padding: 9px 20px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; border: none; }
    .cancel { background: #fff; border: 1px solid #dadce0; color: #1a73e8; }
    .share { background: #1a73e8; color: #fff; }
    .share:disabled { opacity: .5; cursor: default; }
    #msg { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
    .ok   { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .err  { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c4; }
    .busy { background: #e8f0fe; color: #1a73e8; border: 1px solid #aecbfa; }
  </style>
</head>
<body>

<h2>🚗 Share a driver temporarily</h2>

<div class="field">
  <label>Badge number</label>
  <input type="text" id="badgeNo" placeholder="e.g. TTGEN12345" autocomplete="off">
</div>

<div class="field">
  <label>Share with hub</label>
  <select id="targetHub">
    <option value="">— Select hub —</option>
  </select>
</div>

<div class="field">
  <label>Period</label>
  <div class="row2">
    <div>
      <label style="margin-bottom:3px">From</label>
      <input type="date" id="startDate">
    </div>
    <div>
      <label style="margin-bottom:3px">Until (inclusive)</label>
      <input type="date" id="endDate">
    </div>
  </div>
</div>

<div id="msg"></div>

<hr>
<div class="actions">
  <button class="cancel" onclick="google.script.host.close()">Cancel</button>
  <button class="share" id="btn" onclick="share()">Share driver</button>
</div>

<script>
  var now = new Date();
  var today = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  document.getElementById('startDate').value = today;
  document.getElementById('endDate').value   = today;

  document.getElementById('startDate').addEventListener('change', function () {
    var e = document.getElementById('endDate');
    if (e.value < this.value) e.value = this.value;
  });

  google.script.run
    .withSuccessHandler(function (hubs) {
      var sel = document.getElementById('targetHub');
      hubs.forEach(function (h) {
        var o = document.createElement('option');
        o.value = o.textContent = h;
        sel.appendChild(o);
      });
    })
    .getDoelHubs();

  function share() {
    var form = {
      badgeNo:   document.getElementById('badgeNo').value.trim(),
      doelHub:   document.getElementById('targetHub').value,
      startDate: document.getElementById('startDate').value,
      endDate:   document.getElementById('endDate').value,
    };

    if (!form.badgeNo)   { show('err', 'Enter a badge number.'); return; }
    if (!form.doelHub)   { show('err', 'Select a hub.'); return; }
    if (!form.startDate) { show('err', 'Select a start date.'); return; }
    if (!form.endDate)   { show('err', 'Select an end date.'); return; }

    show('busy', 'Working...');
    document.getElementById('btn').disabled = true;

    google.script.run
      .withSuccessHandler(function (r) {
        document.getElementById('btn').disabled = false;
        show(r.success ? 'ok' : 'err', (r.success ? '✅ ' : '❌ ') + r.message);
        if (r.success) {
          document.getElementById('badgeNo').value = '';
          document.getElementById('targetHub').value = '';
        }
      })
      .withFailureHandler(function (e) {
        document.getElementById('btn').disabled = false;
        show('err', '❌ ' + e.message);
      })
      .shareDriver(form);
  }

  function show(type, text) {
    var el = document.getElementById('msg');
    el.className = type;
    el.textContent = text;
    el.style.display = 'block';
  }
</script>
</body>
</html>
